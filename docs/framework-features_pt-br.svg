<svg viewBox="0 0 890 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ffTitle ffDesc">
  <title id="ffTitle">Poseidon — comparacao de recursos de protocolo entre 7 frameworks HTTP</title>
  <desc id="ffDesc">Matriz de recursos comparando Poseidon com Horse, mORMot2, Actix, Go Fiber, Kestrel e nginx em HTTP/1.1, HTTP/2, HTTP/3, WebSocket nativo, TLS nativo com SNI e binarios nativos autocontidos. Mesmo conjunto de 7 frameworks usado no benchmark de throughput multi-framework.</desc>

  <style>
    :root {
      --bg: #ffffff;
      --panel-bg: #f6f8fa;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #57606a;
      --poseidon: #0969da;
      --poseidon-bg: #ddf1ff;
      --good: #1a7f37;
      --good-bg: #dafbe1;
      --partial: #9a6700;
      --partial-bg: #fff8c5;
      --bad: #82071e;
      --bad-bg: #ffebe9;
      --header-bg: #eaeef2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --panel-bg: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --poseidon: #4493f8;
        --poseidon-bg: #0c2d4d;
        --good: #56d364;
        --good-bg: #113319;
        --partial: #e3b341;
        --partial-bg: #3d2f05;
        --bad: #ff7b72;
        --bad-bg: #3c0d12;
        --header-bg: #1c2128;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0d1117; --panel-bg: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e;
      --poseidon: #4493f8; --poseidon-bg: #0c2d4d; --good: #56d364; --good-bg: #113319;
      --partial: #e3b341; --partial-bg: #3d2f05; --bad: #ff7b72; --bad-bg: #3c0d12; --header-bg: #1c2128;
    }
    :root[data-theme="light"] {
      --bg: #ffffff; --panel-bg: #f6f8fa; --border: #d0d7de; --text: #1f2328; --muted: #57606a;
      --poseidon: #0969da; --poseidon-bg: #ddf1ff; --good: #1a7f37; --good-bg: #dafbe1;
      --partial: #9a6700; --partial-bg: #fff8c5; --bad: #82071e; --bad-bg: #ffebe9; --header-bg: #eaeef2;
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bgrect { fill: var(--bg); }
    .panel { fill: var(--panel-bg); stroke: var(--border); stroke-width: 1; }
    .title { fill: var(--text); font-size: 20px; font-weight: 700; }
    .subtitle { fill: var(--muted); font-size: 12.5px; }
    .col-header { fill: var(--text); font-size: 13px; font-weight: 700; text-anchor: middle; }
    .col-header-poseidon { fill: var(--poseidon); font-size: 13px; font-weight: 800; text-anchor: middle; }
    .row-label { fill: var(--text); font-size: 13px; font-weight: 600; text-anchor: start; }
    .cell-border { fill: none; stroke: var(--border); stroke-width: 1; }
    .poseidon-col-bg { fill: var(--poseidon-bg); }
    .header-bg { fill: var(--header-bg); }
    .mark-good { fill: var(--good); font-size: 15px; font-weight: 800; text-anchor: middle; }
    .mark-partial { fill: var(--partial); font-size: 13px; font-weight: 800; text-anchor: middle; }
    .mark-bad { fill: var(--bad); font-size: 14px; font-weight: 800; text-anchor: middle; }
    .legend-text { fill: var(--muted); font-size: 11.5px; }
    .foot { fill: var(--muted); font-size: 11px; font-style: italic; }
    .note { fill: var(--muted); font-size: 10.5px; }
  </style>

  <rect class="bgrect" x="0" y="0" width="890" height="560"/>

  <text class="title" x="30" y="34">Recursos de protocolo — Poseidon vs. 6 frameworks</text>
  <text class="subtitle" x="30" y="53">Mesmo conjunto de 7 frameworks do benchmark multi-framework (throughput no README/playbook) — aqui, superfície de funcionalidades, não velocidade.</text>

  <!-- Table geometry -->
  <!-- label col: x=30..230 (200 wide); 7 data cols: x=230..860 (90 each) -->

  <g transform="translate(0, 80)">
    <!-- header row background -->
    <rect class="header-bg" x="30" y="0" width="830" height="40" rx="6"/>
    <rect class="poseidon-col-bg" x="230" y="0" width="90" height="452" rx="0"/>

    <!-- column headers -->
    <text class="row-label" x="42" y="25" font-weight="700">Recurso</text>
    <text class="col-header-poseidon" x="275" y="25">Poseidon</text>
    <text class="col-header" x="365" y="25">Horse</text>
    <text class="col-header" x="455" y="18">mORMot2</text>
    <text class="col-header" x="545" y="25">Actix</text>
    <text class="col-header" x="635" y="18">Go</text>
    <text class="col-header" x="635" y="32">Fiber</text>
    <text class="col-header" x="725" y="25">Kestrel</text>
    <text class="col-header" x="815" y="25">nginx</text>

    <!-- outer frame -->
    <rect class="cell-border" x="30" y="0" width="830" height="452" rx="8"/>
    <!-- header/body divider -->
    <line class="cell-border" x1="30" y1="40" x2="860" y2="40"/>
    <!-- vertical separators between columns -->
    <line class="cell-border" x1="230" y1="0" x2="230" y2="452"/>
    <line class="cell-border" x1="320" y1="0" x2="320" y2="452"/>
    <line class="cell-border" x1="410" y1="0" x2="410" y2="452"/>
    <line class="cell-border" x1="500" y1="0" x2="500" y2="452"/>
    <line class="cell-border" x1="590" y1="0" x2="590" y2="452"/>
    <line class="cell-border" x1="680" y1="0" x2="680" y2="452"/>
    <line class="cell-border" x1="770" y1="0" x2="770" y2="452"/>

    <!-- Row template: 6 rows, each 68.6px tall starting at y=40, centers at ~74,143,211,280,348,417 -->
    <!-- row 1: HTTP/1.1 -->
    <line class="cell-border" x1="30" y1="108" x2="860" y2="108"/>
    <text class="row-label" x="42" y="79">HTTP/1.1 keep-alive</text>
    <text class="mark-good" x="275" y="80">&#10003;</text>
    <text class="mark-good" x="365" y="80">&#10003;</text>
    <text class="mark-good" x="455" y="80">&#10003;</text>
    <text class="mark-good" x="545" y="80">&#10003;</text>
    <text class="mark-good" x="635" y="80">&#10003;</text>
    <text class="mark-good" x="725" y="80">&#10003;</text>
    <text class="mark-good" x="815" y="80">&#10003;</text>

    <!-- row 2: HTTP/2 -->
    <line class="cell-border" x1="30" y1="177" x2="860" y2="177"/>
    <text class="row-label" x="42" y="148">HTTP/2</text>
    <text class="mark-good" x="275" y="149">&#10003;</text>
    <text class="mark-bad" x="365" y="149">&#10007;</text>
    <text class="mark-partial" x="455" y="149">~</text>
    <text class="mark-good" x="545" y="149">&#10003;</text>
    <text class="mark-bad" x="635" y="149">&#10007;</text>
    <text class="mark-good" x="725" y="149">&#10003;</text>
    <text class="mark-good" x="815" y="149">&#10003;</text>

    <!-- row 3: HTTP/3 -->
    <line class="cell-border" x1="30" y1="245" x2="860" y2="245"/>
    <text class="row-label" x="42" y="216">HTTP/3 (QUIC)</text>
    <text class="mark-bad" x="275" y="216">&#10007;</text>
    <text class="mark-bad" x="365" y="216">&#10007;</text>
    <text class="mark-bad" x="455" y="216">&#10007;</text>
    <text class="mark-bad" x="545" y="216">&#10007;</text>
    <text class="mark-bad" x="635" y="216">&#10007;</text>
    <text class="mark-good" x="725" y="216">&#10003;</text>
    <text class="mark-good" x="815" y="216">&#10003;</text>

    <!-- row 4: WebSocket -->
    <line class="cell-border" x1="30" y1="314" x2="860" y2="314"/>
    <text class="row-label" x="42" y="285">WebSocket nativo</text>
    <text class="mark-good" x="275" y="285">&#10003;</text>
    <text class="mark-bad" x="365" y="285">&#10007;</text>
    <text class="mark-good" x="455" y="285">&#10003;</text>
    <text class="mark-partial" x="545" y="285">~</text>
    <text class="mark-partial" x="635" y="285">~</text>
    <text class="mark-good" x="725" y="285">&#10003;</text>
    <text class="mark-bad" x="815" y="285">&#10007;</text>

    <!-- row 5: Native TLS -->
    <line class="cell-border" x1="30" y1="382" x2="860" y2="382"/>
    <text class="row-label" x="42" y="353">TLS nativo (SNI/mTLS)</text>
    <text class="mark-good" x="275" y="353">&#10003;</text>
    <text class="mark-partial" x="365" y="353">~</text>
    <text class="mark-good" x="455" y="353">&#10003;</text>
    <text class="mark-good" x="545" y="353">&#10003;</text>
    <text class="mark-good" x="635" y="353">&#10003;</text>
    <text class="mark-good" x="725" y="353">&#10003;</text>
    <text class="mark-good" x="815" y="353">&#10003;</text>

    <!-- row 6: Native self-contained binary -->
    <text class="row-label" x="42" y="422">Binario autocontido</text>
    <text class="mark-good" x="275" y="422">&#10003;</text>
    <text class="mark-good" x="365" y="422">&#10003;</text>
    <text class="mark-good" x="455" y="422">&#10003;</text>
    <text class="mark-good" x="545" y="422">&#10003;</text>
    <text class="mark-good" x="635" y="422">&#10003;</text>
    <text class="mark-partial" x="725" y="422">~</text>
    <text class="mark-good" x="815" y="422">&#10003;</text>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 500)">
    <text class="mark-good" x="8" y="4" text-anchor="start">&#10003;</text>
    <text class="legend-text" x="24" y="4">nativo/embutido</text>
    <text class="mark-partial" x="160" y="4" text-anchor="start">~</text>
    <text class="legend-text" x="176" y="4">parcial / addon oficial</text>
    <text class="mark-bad" x="400" y="4" text-anchor="start">&#10007;</text>
    <text class="legend-text" x="416" y="4">nao suportado pelo projeto</text>
  </g>

  <text class="note" x="30" y="524">nginx e um proxy/servidor web, nao um framework de aplicacao — linha de WebSocket refere-se a terminacao nativa de app, nao a proxy de upgrade.</text>
  <text class="foot" x="30" y="542">Unico gap do Poseidon aqui e HTTP/3 (rastreado, tier-3). Fontes: docs publicos de cada projeto + docs/playbook/07-benchmarking. 2026-08.</text>
</svg>
